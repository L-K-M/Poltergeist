name: poltergeist_app
description: Poltergeist cross-platform file transfer client.
publish_to: none
version: 1.0.0+1000099

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.2'

dependencies:
  # OS file drop-in for the panes (02 §5.1, D14); desktop platforms only.
  desktop_drop: 0.7.1
  # The native executable picker behind Open With ▸ Other… on
  # Windows/Linux (06 §4.3); macOS uses the poltergeist/files channel.
  # Needs the AGP-9 Kotlin re-apply in android/build.gradle.kts.
  file_picker: 11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The OS-keystore access behind the vault master key; version-matched to
  # Séance's lock so the ported MasterKeyManager behavior is identical.
  flutter_secure_storage: 10.3.1
  intl: 0.20.3
  macos_window_utils: 1.9.1
  # The running build's version for the D19 update check (07 §3.10) —
  # version-matched to Séance's lock.
  package_info_plus: 8.3.1
  path: 1.9.1
  path_provider: 2.1.6
  # Applies owner-only mode bits to path-bearing local audit files.
  posix: 6.5.2
  poltergeist_core:
    path: ../../packages/poltergeist_core
  poltergeist_sync:
    path: ../../packages/poltergeist_sync
  screen_retriever: 0.2.2
  # The update banner's "View release" link — hands the releases URL to
  # the OS browser; the app never downloads release assets (00 D23).
  url_launcher: 6.3.2
  uuid: 4.6.0
  window_manager: 0.5.2
  pdfrx: 2.6.1

dev_dependencies:
  analyzer: 14.1.0
  # MockClient for the update-check request-shape test (01 §6's pinned
  # egress contract); test-only, nothing shipped.
  http: 1.6.0
  # Fixture-hash verification in tool/unicode/generate.dart (matches the
  # version poltergeist_core's dependency already locks).
  crypto: 3.0.7
  fake_async: 1.3.3
  # flutter drive + the binding for the tier-B profile benchmark suites
  # (integration_test/perf/); app-side use only, nothing shipped.
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../media-sources/icon.png
  min_sdk_android: 24
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: ../../media-sources/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: ../../media-sources/icon.png

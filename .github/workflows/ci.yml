name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least privilege: the jobs only need to read the repo.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

# Cancel an in-progress run when a *PR branch* is pushed again — but never cancel an
# in-progress run on main, or that commit is left with a permanently "cancelled"
# status (masking breakage and putting holes in CI-status bisection). GitHub can
# still supersede a *queued* main run with a newer queued one — only the running
# run is protected.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dart:
    name: Pure-Dart packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows; never interpret the package loops as PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      # The harness resolves standalone (frozen pins outside the workspace
      # lock), so its loop entries below need their own package config.
      - name: Resolve M0 benchmark harness
        working-directory: packages/poltergeist_bench
        run: dart pub get
      # Discover packages, but keep every analyze/test path explicit.
      - name: Analyze
        run: |
          set -euo pipefail
          for package in packages/*; do
            [[ -d "$package" ]] || continue
            dart analyze "$package"
          done
      - name: Test
        run: |
          set -euo pipefail
          dirs=()
          for package in packages/*; do
            [[ -d "$package/test" ]] || continue
            # The harness suite is Linux-bound (monotonic evidence reads
            # /proc/uptime), so dart_tools (Ubuntu) owns its tests; this
            # multi-OS loop runs the host-neutral package suites.
            if [[ "$package" == 'packages/poltergeist_bench' ]]; then
              continue
            fi
            dirs+=("$package")
          done
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "no package has a test/ directory yet"; exit 1
          fi
          dart test --reporter expanded "${dirs[@]}"

  # These guards use POSIX tools, Docker, or GNU timeout, not native contracts.
  dart_tools:
    name: Dart tooling (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      - name: Resolve M0 benchmark harness
        working-directory: packages/poltergeist_bench
        run: dart pub get
      - name: Resolve legacy bench entrypoint
        working-directory: tool/bench
        run: dart pub get
      - name: Analyze dependency guard
        run: dart analyze tool/import_guard
      - name: Test dependency guard
        run: dart test tool/import_guard/test
      # Contract: the script must exit non-zero on any 03 §1 violation —
      # including scan errors and a missing scan root — so this gate fails
      # closed.
      - name: Check dependency boundaries (03 §1)
        run: bash scripts/check-imports.sh
      - name: Analyze engine protocol guard
        run: dart analyze tool/protocol_guard
      - name: Test engine protocol guard
        run: dart test tool/protocol_guard/test
      - name: Check engine protocol boundaries (08 §3.3)
        run: dart run tool/protocol_guard/bin/check.dart .
      - name: Analyze release gate
        run: dart analyze tool/license_gate
      - name: Analyze release version tool
        run: dart analyze tool/release_version
      - name: Analyze Séance pin audit
        run: dart analyze tool/seance_pin_audit
      - name: Analyze M0 benchmark harness
        working-directory: packages/poltergeist_bench
        run: dart analyze
      - name: Analyze benchmark contract tests
        run: dart analyze test/benchmarks
      - name: Analyze integration fixture tools
        run: dart analyze test/integration
      - name: Test release gate
        run: dart test tool/license_gate/test
      - name: Test release version tool
        run: dart test tool/release_version/test
      - name: Verify release versions
        run: dart run tool/release_version/bin/release_version.dart check
      - name: Test Séance pin audit
        run: dart test tool/seance_pin_audit/test
      - name: Test M0 benchmark harness
        working-directory: packages/poltergeist_bench
        run: dart test test
      - name: Validate committed M0 evidence
        working-directory: packages/poltergeist_bench
        run: >-
          dart run benchmark/validate_bundle.dart
          --bundle ../../docs/evidence/m0
          --report ../../docs/M0-DARTSSH2-REPORT.md
          --repo ../..
      - name: Test benchmark contract tests
        run: dart test test/benchmarks
      - name: Test integration fixture tools
        run: dart test test/integration
      - name: Validate rendered integration fixture
        run: |
          test/integration/test-fixture-safety.sh
          source test/integration/lib/fixture.sh
          check_rendered_config
      # D30 allows pre-license pins in development, so PR CI checks the
      # fail-closed release wiring without requiring the upstream license yet.
      - name: Guard Séance release gate
        run: dart run tool/license_gate/bin/check.dart --marker-only

  seance_pin_audit:
    name: Séance pin audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: changes
        with:
          filters: |
            pin:
              - '**/pubspec.yaml'
              - '**/pubspec.lock'
              - 'docs/PORTS.md'
              - 'scripts/audit-seance-pin.sh'
              - 'tool/seance_pin_audit/**'
              - '.github/workflows/ci.yml'
      - uses: dart-lang/setup-dart@v1
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.pin == 'true'
        with:
          sdk: stable
      - name: Resolve audit dependencies
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.pin == 'true'
        run: dart pub get
      # The script clones the locked Séance ref itself, without a depth cap.
      - name: Verify recorded Séance pin audit
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.pin == 'true'
        run: scripts/audit-seance-pin.sh

  detect_integration:
    name: Detect SSH integration changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.fixture.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            integration:
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'packages/**/lib/**'
              - 'packages/**/test/**'
              - 'packages/**/pubspec.yaml'
              - 'test/integration/**'
              - '.github/workflows/ci.yml'
            fixture:
              - 'test/integration/**'
              - '.github/workflows/ci.yml'
      - name: Require fixture when its lifecycle changes
        id: fixture
        if: >-
          github.event_name != 'pull_request' ||
          steps.changes.outputs.integration == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          FIXTURE_CHANGED: ${{ steps.changes.outputs.fixture }}
        run: |
          readonly fixture_path='test/integration/docker-compose.yml'
          if [[ -f "$fixture_path" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Source-only PRs may precede the fixture; deletion must fail closed.
          if [[ "$EVENT_NAME" != 'pull_request' || "$FIXTURE_CHANGED" == 'true' ]]; then
            echo "::error::Missing integration fixture: $fixture_path"
            exit 1
          fi

          echo 'run=false' >> "$GITHUB_OUTPUT"

  integration:
    name: SSH integration tests
    needs: detect_integration
    if: needs.detect_integration.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      # run.sh owns readiness, serialized tests, and teardown on every exit.
      - name: Run SSH integration fixture
        run: test/integration/run.sh

  detect_bench:
    name: Detect bench-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.fixture.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            bench:
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'packages/**/lib/**'
              - 'packages/**/test/**'
              - 'packages/**/benchmark/**'
              - 'packages/**/pubspec.yaml'
              - 'test/benchmarks/**'
              - 'test/integration/**'
              - 'scripts/bench-tier-a.sh'
              - 'scripts/bench-tier-b.sh'
              - 'scripts/merge_bench_results.dart'
              - 'app/poltergeist_app/pubspec.yaml'
              - 'app/poltergeist_app/lib/bench/**'
              - 'app/poltergeist_app/integration_test/**'
              - 'app/poltergeist_app/test_driver/**'
              - '.github/workflows/ci.yml'
      # Same guard as detect_integration: a matching PR, a main push, or a
      # dispatch always runs the job; an absent fixture fails those runs
      # loudly instead of silently disabling the benchmark. The step only
      # executes for a bench-relevant reason, so a missing fixture is
      # always an error here — never a silent skip.
      - name: Require fixture when its lifecycle changes
        id: fixture
        if: >-
          github.event_name != 'pull_request' ||
          steps.changes.outputs.bench == 'true'
        run: |
          readonly fixture_path='test/integration/docker-compose.yml'
          if [[ ! -f "$fixture_path" ]]; then
            echo "::error::Missing integration fixture: $fixture_path"
            exit 1
          fi

          echo 'run=true' >> "$GITHUB_OUTPUT"

  # D12 benchmarks (08 §5/§6): the tier-A collectors compile AOT and run
  # against the §5 sshd fixture on loopback; the tier-B suites drive the
  # real app in profile mode under Xvfb (`flutter drive --profile`) and
  # capture raster timing through SchedulerBinding.addTimingsCallback.
  # Both legs merge their per-scenario documents into one
  # bench-results.json that check.dart grades. Every scenario is still
  # unlanded in budgets.json, so the job reports rather than gates: no
  # BENCH_ENFORCE_* flag is set here, calibration is the dedicated
  # baseline-refresh procedure (08 §6), and PR runs never touch drift
  # state — which is also why the tier-B leg runs only on main pushes and
  # manual dispatch, never on PRs, and why the evaluate step scopes
  # --tiers to what the event actually ran.
  bench:
    name: D12 benchmarks
    needs: detect_bench
    if: needs.detect_bench.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      # runnerImage is a controlled fingerprint axis: record the runner
      # image so a rotation surfaces as a loud drift notice, not a silent
      # cross-image comparison.
      - name: Run tier-A collectors against the sshd fixture
        run: |
          export POLTERGEIST_BENCH_RUNNER_IMAGE="ubuntu-latest@${ImageVersion:-unreported}"
          test/integration/run.sh --lifecycle-only -- scripts/bench-tier-a.sh
      # Tier-B: profile-mode UI benchmarks under Xvfb (main/dispatch only
      # — trend-only until M9, and PR invocations must not write drift
      # state). !cancelled() so a failed tier-A leg does not silently drop
      # the tier-B evidence a main run is expected to produce, while a
      # cancelled run skips the leg instead of running it anyway.
      - name: Install Flutter toolchain
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # GTK toolchain for the embedder build; xvfb plus the Mesa stack for
      # a headless display with real GLES (llvmpipe via
      # LIBGL_ALWAYS_SOFTWARE) so Impeller produces genuine raster timings.
      - name: Install Linux desktop + headless display toolchain
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev libjsoncpp-dev
          xvfb libegl1 libgles2 libgl1-mesa-dri
      - name: Resolve app dependencies
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        working-directory: app/poltergeist_app
        run: flutter pub get
      - name: Run tier-B collectors under Xvfb
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export POLTERGEIST_BENCH_RUNNER_IMAGE="ubuntu-latest@${ImageVersion:-unreported}"
          scripts/bench-tier-b.sh
      # if: always() so partial results flushed by a failed run are still
      # graded; a missing results file is a check.dart I/O failure, which
      # keeps a fixture-start failure red instead of skipping silently.
      # --tiers mirrors what the event ran: `a` on PRs (tier B never ran),
      # `ab` on main pushes and dispatch.
      - name: Evaluate results
        if: always()
        run: >-
          dart run test/benchmarks/check.dart
          --results bench-results.json
          --tiers ${{ github.event_name == 'pull_request' && 'a' || 'ab' }}
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-results.json
            bench-results-*.json
          if-no-files-found: error
          retention-days: 30

  # M0 measurements are expensive and historical, not a standing PR budget.
  # Dispatch a branch commit so the durable evidence keeps an ancestor SHA.
  m0_bench:
    name: M0 SSH fitness measurements (${{ matrix.shard }})
    needs: [dart, dart_tools, seance_pin_audit]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - standard
          - rtt100-1gb-download-dart-hash-on-r1
          - rtt100-1gb-download-dart-hash-on-r2
          - rtt100-1gb-download-dart-hash-off-r1
          - rtt100-1gb-download-dart-hash-off-r2
          - rtt100-1gb-download-openssh-r1
          - rtt100-1gb-download-openssh-r2
          - rtt100-1gb-upload-dart-hash-on-r1
          - rtt100-1gb-upload-dart-hash-on-r2
          - rtt100-1gb-upload-dart-hash-off-r1
          - rtt100-1gb-upload-dart-hash-off-r2
          - rtt100-1gb-upload-openssh-r1
          - rtt100-1gb-upload-openssh-r2
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve benchmark harness
        working-directory: packages/poltergeist_bench
        run: dart pub get
      - name: Start M0 source evidence
        working-directory: packages/poltergeist_bench
        run: |
          readonly microseconds_per_second=1000000
          read -r monotonic_seconds _ < /proc/uptime
          monotonic_whole="${monotonic_seconds%%.*}"
          monotonic_fraction="${monotonic_seconds#*.}000000"
          monotonic_fraction="${monotonic_fraction:0:6}"
          POLTERGEIST_M0_STARTED_AT_EPOCH_MS="$(date +%s%3N)"
          POLTERGEIST_M0_STARTED_AT_MONOTONIC_US="$((
            10#$monotonic_whole * microseconds_per_second +
            10#$monotonic_fraction
          ))"
          export POLTERGEIST_M0_STARTED_AT_EPOCH_MS
          export POLTERGEIST_M0_STARTED_AT_MONOTONIC_US
          printf '%s\n%s\n' \
            "POLTERGEIST_M0_STARTED_AT_EPOCH_MS=$POLTERGEIST_M0_STARTED_AT_EPOCH_MS" \
            "POLTERGEIST_M0_STARTED_AT_MONOTONIC_US=$POLTERGEIST_M0_STARTED_AT_MONOTONIC_US" \
            >> "$GITHUB_ENV"
          dart run benchmark/package_source.dart start \
            --output bench-shard.json \
            --shard "${{ matrix.shard }}"
      - name: Run fixture and measurements
        id: measurements
        timeout-minutes: 330
        run: packages/poltergeist_bench/run-ci-shard.sh "${{ matrix.shard }}"
      # JSON evidence contains no Séance code or executable artifact (D30).
      - uses: actions/upload-artifact@v4
        id: upload_shard
        if: always()
        continue-on-error: true
        with:
          name: m0-bench-source-${{ matrix.shard }}
          path: packages/poltergeist_bench/bench-shard.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retry shard evidence upload
        if: always() && steps.upload_shard.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m0-bench-source-${{ matrix.shard }}
          path: packages/poltergeist_bench/bench-shard.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  m0_bench_aggregate:
    name: M0 SSH fitness evidence
    needs: m0_bench
    if: >-
      always() &&
      needs.m0_bench.result == 'success' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve benchmark harness
        working-directory: packages/poltergeist_bench
        run: dart pub get
      - name: Download M0 source evidence
        uses: actions/download-artifact@v4
        with:
          pattern: m0-bench-source-*
          path: packages/poltergeist_bench/shards
          merge-multiple: false
      - name: Aggregate M0 measurements
        working-directory: packages/poltergeist_bench
        run: |
          dart run benchmark/aggregate.dart \
            --input-root shards \
            --output-dir evidence \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --git-sha "${{ github.sha }}"
      - name: Upload canonical M0 evidence
        id: upload_evidence
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: m0-bench-results
          path: packages/poltergeist_bench/evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retry canonical M0 evidence upload
        if: always() && steps.upload_evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m0-bench-results
          path: packages/poltergeist_bench/evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # The Flutter jobs below activate themselves the moment app/poltergeist_app
  # lands on the branch under test — no workflow edit needed. Until then they
  # report "skipped", which is neutral for required-check purposes.
  detect:
    name: Detect Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.d.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: echo "app=$([ -d app/poltergeist_app ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter app (analyze + test)
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # first run downloads the Flutter toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve app dependencies
        working-directory: app/poltergeist_app
        run: flutter pub get
      - name: Analyze
        working-directory: app/poltergeist_app
        run: flutter analyze
      - name: Test
        working-directory: app/poltergeist_app
        run: flutter test

  # Compile every client the release workflow ships (android / linux x64 /
  # macos / ios / windows) and run the Linux packaging step, so a
  # platform- or packaging-breaking change is caught here, not when a tag
  # tries to publish. Mirrors release.yml's `client` job minus publishing
  # — keep the two matrices in step.
  client:
    name: Client build (${{ matrix.target }})
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # first run downloads the Flutter toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            build: apk --release
          - os: ubuntu-latest
            target: linux
            build: linux --release
            flavor: x64
          # NOTE: no linux-arm64 entry, on purpose — Flutter does not publish
          # linux-arm64 host artifacts (releases_linux.json is x64-only), so
          # `flutter build linux` cannot run on the arm runners at all. Revisit
          # when Flutter ships arm64 Linux host builds; until then arm64 Linux
          # users have no native client.
          - os: macos-latest
            target: macos
            build: macos --release
          - os: macos-latest
            target: ios
            # Lockstep with release.yml's ios leg: `build ipa --no-codesign`
            # stops at the unsigned .xcarchive, the asset release.yml zips.
            build: ipa --release --no-codesign
          - os: windows-latest
            target: windows
            build: windows --release
    steps:
      - uses: actions/checkout@v4
      # Pin the JDK so the Gradle build is deterministic rather than tracking
      # the runner's default; keep in step with the app's compileOptions.
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      # GTK toolchain for the Flutter Linux embedder, plus libsecret/jsoncpp
      # for flutter_secure_storage's keyring backend. imagemagick/file: the
      # packaging step resizes the launcher icon and appimagetool needs `file`.
      - name: Install Linux desktop toolchain
        if: startsWith(matrix.target, 'linux')
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev libjsoncpp-dev imagemagick file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # If the committed project signs Release with a developer identity the
      # runner doesn't have, switch to ad-hoc — CI must exercise the exact
      # signing path the release uses. Harmless when the project already
      # specifies ad-hoc signing (sed simply matches nothing).
      - name: Switch macOS signing to ad-hoc (runner has no certificate)
        if: matrix.target == 'macos'
        run: |
          sed -i '' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/' \
            app/poltergeist_app/macos/Runner.xcodeproj/project.pbxproj
      - name: Resolve app dependencies
        working-directory: app/poltergeist_app
        run: flutter pub get
      - name: Build
        working-directory: app/poltergeist_app
        run: flutter build ${{ matrix.build }}
      # Prove Gradle consumed the synchronized pubspec code in the real APK.
      - name: Verify Android version code
        if: matrix.target == 'android'
        working-directory: app/poltergeist_app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/verify-android-version.sh"
      # Exercise the same packaging the release workflow ships. Do not upload
      # binaries from ordinary CI: before PR-S0, a build may embed a permitted
      # development-only Séance pin whose tree grants recipients no rights.
      - name: Package Linux artifacts (.deb + AppImage)
        if: startsWith(matrix.target, 'linux')
        run: scripts/package-linux.sh --output-dir dist-packages

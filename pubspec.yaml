# Poltergeist — Dart pub workspace root.
#
# Groups the pure-Dart packages that can be built and tested without the
# Flutter SDK. The Flutter app in `app/poltergeist_app` (once scaffolded) is
# intentionally NOT a workspace member: it requires the Flutter SDK and is
# resolved on its own.
name: _poltergeist_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/poltergeist_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

name: poltergeist_m0_bench
# Kept from tool/bench so the existing `package:poltergeist_m0_bench/...`
# imports survive the relocation to packages/poltergeist_bench.
description: Reproducible M0 SSH fitness measurements for Poltergeist.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  dartssh2: 3.0.2
  seance_core:
    git:
      url: https://github.com/L-K-M/Seance.git
      ref: v0.9.1
      path: packages/seance_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  yaml: ^3.1.3

name: poltergeist_core
description: >-
  Platform-agnostic core for Poltergeist: connections, transfers, the sync
  engine, and the bookmark model per docs/plan/.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # D2: git-pinned to Séance, never forked or copied. The steady state is a
  # tag pin; this rev pin (post PR-S3, pre-next-tag) is recorded as a dated
  # open item in docs/STATUS.md and re-pinned at Séance's next release.
  seance_core:
    git:
      url: https://github.com/L-K-M/Seance.git
      ref: 2f99f4efb25a83340605464635bdf0f3ba95d931
      path: packages/seance_core
  # Pinned exactly like seance_core pins it, and confined to
  # lib/src/connection/ by the CI import check (03 §1).
  dartssh2: 3.0.2
  meta: ^1.15.0

dev_dependencies:
  fake_async: 1.3.3
  lints: ^5.0.0
  test: ^1.25.0

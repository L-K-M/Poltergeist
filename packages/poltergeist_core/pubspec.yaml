name: poltergeist_core
description: >-
  Platform-agnostic core for Poltergeist: connections, transfers, the sync
  engine, and the bookmark model per docs/plan/.
version: 0.2.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # D2: git-pinned to Séance, never forked or copied. Tag pin at Séance
  # v0.9.1 — the first release containing the PR-S3 merge (Séance #62:
  # setTimes/setOwner/opt-out transfer hashing, merge 2f99f4e) and PR-S1;
  # the M8 S3 gate (07 §3.9) is satisfied by this rev.
  seance_core:
    git:
      url: https://github.com/L-K-M/Seance.git
      ref: v0.9.1
      path: packages/seance_core
  # Pinned exactly like seance_core pins it, and confined to
  # lib/src/connection/ by the CI import check (03 §1).
  dartssh2: 3.0.2
  # LocalFileSystem's streamed SHA-256 and cross-platform path
  # normalization (03 §1's sanctioned core dependencies).
  crypto: ^3.0.0
  path: ^1.9.0
  meta: ^1.15.0
  # The Linux inotify watch backend's native buffer/string marshalling
  # (dart:ffi has no allocator; 03 §7.5). Version matches the lockfile.
  ffi: ^2.2.0
  clock: ^1.1.3

dev_dependencies:
  # Exercise the vault's locked primitives without changing runtime deps.
  cryptography: 2.9.0
  fake_async: ^1.3.3
  lints: ^5.0.0
  test: ^1.25.0

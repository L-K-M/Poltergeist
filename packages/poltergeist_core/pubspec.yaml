name: poltergeist_core
description: >-
  Platform-agnostic core for Poltergeist: connections, transfers, the sync
  engine, and the bookmark model per docs/plan/.
version: 0.2.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # D2: git-pinned to Séance, never forked or copied. The steady state is a
  # tag pin; this rev pin (Séance #79's probe-lifecycle repair, #80/#81's
  # identity-audit work, and #74's SSH-trace redaction, pre-next-tag) is
  # recorded as a dated open item in docs/STATUS.md and re-pinned at
  # Séance's next release.
  seance_core:
    git:
      url: https://github.com/L-K-M/Seance.git
      ref: 2e6d1f138f1704e683870f75e11262bf50e37379
      path: packages/seance_core
  # Pinned exactly like seance_core pins it, and confined to
  # lib/src/connection/ by the CI import check (03 §1).
  dartssh2: 3.0.2
  meta: ^1.15.0

dev_dependencies:
  # Exercise the vault's locked primitives without changing runtime deps.
  cryptography: 2.9.0
  fake_async: ^1.3.3
  lints: ^5.0.0
  test: ^1.25.0
